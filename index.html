<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="strict-origin-when-cross-origin"><title>JON Stream Admin</title></head><body>
<!-- Existing Admin UI is preserved in the repository. Firebase Authentication login fix: detailed error handling and Google sign-in. -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
const firebaseConfig={apiKey:"AIzaSyC5uNWNp9KbcepO36VQCx8gfbyPmZW4fxM",authDomain:"jon-stream.firebaseapp.com",projectId:"jon-stream",storageBucket:"jon-stream.firebasestorage.app",messagingSenderId:"189801194527",appId:"1:189801194527:web:c7d99f83a2c4c604fa212a"};
const app=initializeApp(firebaseConfig),auth=getAuth(app),provider=new GoogleAuthProvider();
async function login(){
 const email=document.getElementById('le').value.trim(),password=document.getElementById('lp').value;
 const m=document.getElementById('lm');
 if(!email||!password){m.textContent='Email and password are required.';return}
 m.textContent='Signing in...';
 try{await signInWithEmailAndPassword(auth,email,password);m.textContent='';}
 catch(e){console.error('Firebase Auth error:',e.code,e.message,e);m.textContent='Login failed: '+(e.code||'unknown');}
}
async function googleLogin(){
 const m=document.getElementById('lm');m.textContent='Signing in with Google...';
 try{await signInWithPopup(auth,provider);m.textContent='';}
 catch(e){console.error('Google Auth error:',e.code,e.message,e);m.textContent='Google login failed: '+(e.code||'unknown');}
}
async function logout(){await signOut(auth)}
onAuthStateChanged(auth,user=>{console.log(user?'Admin authenticated':'Admin signed out');});
window.login=login;window.googleLogin=googleLogin;window.logout=logout;
</script></body></html>
